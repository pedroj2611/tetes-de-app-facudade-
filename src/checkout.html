<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Finalizar Pedido | Sabor & Arte Gourmet</title>

  <meta name="description" content="Finalize seu pedido de forma rápida e segura no Sabor & Arte Gourmet.">
  <meta name="theme-color" content="#8b1c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Tipografia Gourmet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Estilos MVC -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">
</head>
<body class="page-checkout">

  <!-- BARRA SUPERIOR DO CHECKOUT -->
  <header class="checkout-header">
    <div class="checkout-header-container">
      <a href="index.html" class="btn-voltar-cardapio" title="Voltar ao Cardápio" aria-label="Voltar ao Cardápio">
        <span>← Voltar ao Cardápio</span>
      </a>
      <div class="checkout-title-box">
        <h1 class="checkout-main-title">🛍️ Conferir Pedido</h1>
        <p class="checkout-sub-title" id="display-nome-loja">Sabor & Arte Gourmet</p>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL DO CHECKOUT -->
  <main class="checkout-container">
    
    <!-- CARD 1: ITENS DO PEDIDO -->
    <section class="checkout-card">
      <div class="checkout-card-header">
        <h2>📋 Itens Selecionados</h2>
        <button id="btn-limpar-checkout" class="btn-esvaziar-checkout">Limpar</button>
      </div>
      <div id="checkout-itens-lista" class="pedido-itens-lista">
        <!-- Injetado dinamicamente via JS -->
      </div>
    </section>

    <!-- CARD 2: DADOS DE ENTREGA E ATENDIMENTO -->
    <section class="checkout-card">
      <div class="checkout-card-header">
        <h2>📍 Informações de Entrega & Cliente</h2>
      </div>

      <form id="form-checkout" onsubmit="return false;">
        <div class="input-grupo">
          <label for="cliente-nome">Nome Completo do Cliente *</label>
          <input type="text" id="cliente-nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="input-grupo">
          <label for="tipo-atendimento">Forma de Atendimento *</label>
          <select id="tipo-atendimento">
            <option value="Delivery">Entrega em Domicílio (Delivery)</option>
            <option value="Mesa">Consumo no Local (Mesa)</option>
            <option value="Balcão">Retirada no Balcão</option>
          </select>
        </div>

        <div class="input-grupo" id="grupo-local">
          <label for="cliente-local" id="rotulo-local">Endereço Completo de Entrega *</label>
          <input type="text" id="cliente-local" placeholder="Rua, Número, Bairro, Ponto de Referência" required>
        </div>

        <div class="input-grupo">
          <label for="forma-pagamento">Forma de Pagamento *</label>
          <select id="forma-pagamento">
            <option value="PIX">PIX (Chave Instantânea)</option>
            <option value="Cartão de Crédito">Cartão de Crédito (Na entrega)</option>
            <option value="Cartão de Débito">Cartão de Débito (Na entrega)</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <!-- BOX PIX -->
        <div class="input-grupo box-pix" id="grupo-pix" style="display: none;">
          <div class="pix-card">
            <div class="pix-info">
              <span class="pix-badge">⚡ Chave PIX do Restaurante</span>
              <span class="pix-chave" id="pix-chave-texto">pix@saborearte.com.br</span>
            </div>
            <button type="button" id="btn-copiar-pix" class="btn-copiar">Copiar Chave</button>
          </div>
        </div>

        <!-- CAMPO DINHEIRO / TROCO -->
        <div class="input-grupo" id="grupo-troco" style="display: none;">
          <label for="pedido-troco">Troco para Quanto? (R$)</label>
          <input type="text" id="pedido-troco" placeholder="Ex: R$ 50,00 ou Não preciso de troco">
        </div>

        <div class="input-grupo">
          <label for="pedido-obs">Observações do Pedido (opcional)</label>
          <textarea id="pedido-obs" rows="2" placeholder="Ex: Sem cebola, molho extra, carne bem passada..."></textarea>
        </div>
      </form>
    </section>

    <!-- CARD 3: RESUMO DOS VALORES E BOTÃO FINALIZAR -->
    <section class="checkout-card checkout-resumo-card">
      <div class="resumo-valores">
        <div class="resumo-linha">
          <span>Subtotal (itens):</span>
          <span id="checkout-subtotal-valor">R$ 0,00</span>
        </div>
        <div class="resumo-linha" id="linha-taxa-entrega">
          <span>Taxa de Entrega:</span>
          <span id="checkout-taxa-valor">R$ 5,00</span>
        </div>
        <div class="resumo-linha total-destaque-linha">
          <span>Total Geral:</span>
          <span id="checkout-valor-total" class="preco-verde">R$ 0,00</span>
        </div>
      </div>

      <button type="button" id="btn-enviar-whatsapp" class="btn-whatsapp-empresa full-btn">
        <span>📲 Enviar Pedido via WhatsApp</span>
      </button>
    </section>

  </main>

  <!-- MODAL DE CONFIRMAÇÃO CUSTOMIZADO -->
  <dialog id="modal-confirmacao" class="modal-dialog modal-small">
    <div class="modal-content">
      <div class="modal-body" style="text-align: center; padding: 24px;">
        <span id="confirm-icon" style="font-size: 2.5rem; display: block; margin-bottom: 12px;">⚠️</span>
        <h3 id="confirm-titulo" style="font-size: 1.15rem; font-weight: 800; color: var(--dark); margin-bottom: 8px;">Tem certeza?</h3>
        <p id="confirm-mensagem" style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px;">Essa ação não poderá ser desfeita.</p>
        
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button type="button" id="btn-confirm-cancelar" class="btn-fechar" style="width: auto; height: auto; border-radius: var(--radius-sm); padding: 8px 16px;">Cancelar</button>
          <button type="button" id="btn-confirm-ok" class="btn-esvaziar" style="padding: 8px 16px;">Confirmar</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- NOTIFICAÇÃO TOAST -->
  <div id="toast" class="toast-aviso" role="alert" aria-live="polite"></div>

  <!-- SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js", { updateViaCache: 'none' })
        .then(reg => reg.update())
        .catch(err => console.error("Erro SW:", err));
    }
  </script>

  <!-- CONTROLLER CHECKOUT (MVC) -->
  <script type="module" src="js/controllers/CheckoutController.js"></script>
</body>
</html>
